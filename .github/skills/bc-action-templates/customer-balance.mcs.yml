mcs.metadata:
  componentName: BC - Customer Balance
  description: "Description: Query customer ledger entries and current balance from Business Central via MCP"
kind: TaskDialog
inputs:
  - kind: ManualTaskInput
    propertyName: bcenvironment
    value: _REPLACE_BC_ENVIRONMENT

  - kind: ManualTaskInput
    propertyName: configurationName
    value: _REPLACE_MCP_CONFIG

  - kind: ManualTaskInput
    propertyName: company
    value: _REPLACE_BC_COMPANY

modelDisplayName: BC Customer Balance
modelDescription: >-
  Retrieves customer balance information from Business Central.
  Use when the user asks about a customer's current balance, outstanding amount,
  total receivables, account status, or ledger entries.
  Requires a customer name, number, or identifier to look up the balance.
action:
  kind: InvokeExternalAgentTaskAction
  connectionReference: _REPLACE_CONNECTION_REFERENCE
  connectionProperties:
    mode: Invoker

  operationDetails:
    kind: ModelContextProtocolMetadata
    operationId: InvokeMCP